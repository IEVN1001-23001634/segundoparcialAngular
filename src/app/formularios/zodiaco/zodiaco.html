<div class="flex flex-col md:flex-row gap-10 p-10 font-sans text-black">
  
  <!-- Contenedor del Formulario -->
  <div class="border-2 border-black w-full max-w-md pb-4">
    
    <div class="text-center border-b-2 border-black py-1 mb-4 font-semibold">
      Datos Personales
    </div>

    <form [formGroup]="formulario" (ngSubmit)="imprimir()" class="px-4 space-y-3">
      
      <div class="flex justify-between items-center">
        <label>Nombre</label>
        <input type="text" formControlName="nombre" class="border border-black w-2/3 px-1">
      </div>

      <div class="flex justify-between items-center">
        <label>Apaterno</label>
        <input type="text" formControlName="apaterno" class="border border-black w-2/3 px-1">
      </div>

      <div class="flex justify-between items-center">
        <label>Amaterno</label>
        <input type="text" formControlName="amaterno" class="border border-black w-2/3 px-1">
      </div>

      <div class="mt-4 text-center">
        <label class="block mb-1">Fecha de nacimiento</label>
        <div class="flex justify-center gap-2">
          <div class="text-center">
            <span class="block text-sm">Día</span>
            <input type="text" formControlName="dia" class="border border-black w-12 px-1 text-center">
          </div>
          <div class="text-center">
            <span class="block text-sm">Mes</span>
            <input type="text" formControlName="mes" class="border border-black w-12 px-1 text-center">
          </div>
          <div class="text-center">
            <span class="block text-sm">Año</span>
            <input type="text" formControlName="anio" class="border border-black w-16 px-1 text-center">
          </div>
        </div>
      </div>

      <div class="mt-4">
        <label class="block font-semibold mb-1">sexo</label>
        <div class="flex flex-col ml-4">
          <label>
            <input type="radio" value="Masculino" formControlName="sexo"> Masculino
          </label>
          <label>
            <input type="radio" value="Femenino" formControlName="sexo"> Femenino
          </label>
        </div>
      </div>

      <!-- Botones de acción -->
      <div class="mt-6 border-t-2 border-black pt-4 flex gap-4">
        <button type="submit" class="border-2 border-black bg-gray-200 px-4 py-1 font-bold shadow-[2px_2px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-1">
          imprimir
        </button>
        
        <!-- Botón para ver registros -->
        <a routerLink="/lista-registros-zodiaco" class="border-2 border-black bg-gray-200 px-4 py-1 font-bold text-center shadow-[2px_2px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-1">
          Ver Registros
        </a>
      </div>

    </form>
  </div>

  <!-- Contenedor del Resultado -->
  <div *ngIf="mostrado" class="w-full max-w-md flex flex-col items-center pt-10 text-lg space-y-6">
    <p>Hola <strong>{{ nombreCompleto }}</strong></p>
    
    <p>Tienes <strong>{{ edad }}</strong> años</p>
    
    <div class="text-center">
      <p>tu signo zodiacal</p>
      <div class="bg-blue-600 rounded-full w-24 h-24 flex items-center justify-center mx-auto my-4">
        <img [src]="imagenSigno" [alt]="signo" class="w-16 h-16 object-contain">
      </div>
      <p>Es {{ signo | lowercase }}</p>
    </div>
  </div>

</div>
