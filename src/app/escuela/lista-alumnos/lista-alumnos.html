<div class="max-w-4xl mx-auto p-8 bg-white rounded-lg shadow mt-10">

  <h1 class="text-3xl font-bold text-gray-900 mb-6 text-center md:text-left">
    Lista Alumnos
  </h1>
 
  
  <form [formGroup]="formulario" (ngSubmit)="muestraAlumnos()">
 
    <div class="mb-5">
      <label for="matricula" class="block mb-2 text-sm font-medium text-gray-900">
        Matricula
      </label>
      
      <input type="text" id="matricula" name="matricula" formControlName="matricula" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Matricula">
    </div>
 
    <div class="mb-5">
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">
        Nombre
      </label>
      <input type="text" id="nombre" name="nombre" formControlName="nombre" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Nombre">
    </div>

    <div class="mb-5">
      <label for="correo" class="block mb-2 text-sm font-medium text-gray-900">
        Correo
      </label>
      <input type="email" id="correo" name="correo" formControlName="correo" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Correo">
    </div>

    <div class="mb-5">
      <label for="materia" class="block mb-2 text-sm font-medium text-gray-900">
        Materia
      </label>
      <input type="text" id="materia" name="materia" formControlName="materia" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Materia">
    </div>
 
    <div class="flex justify-center mt-6">
      <button type="submit" class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm px-10 py-2.5 text-center">
        Registrar
      </button>
    </div>
 
  </form>

    <p class="text-gray-800">Matrícula: {{ alumno.matricula }}</p>
    <p class="text-gray-800">Nombre: {{ alumno.nombre }}</p>
    <p class="text-gray-800">Correo: {{ alumno.correo }}</p>
    <p class="text-gray-800">Materia: {{ alumno.materia }}</p>
 
</div>
